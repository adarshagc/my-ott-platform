<!DOCTYPE html>
<html>
<head>
    <title>My OTT Platform</title>
    <style>
        body { background: #141414; color: white; font-family: Arial; }
        .container { padding: 50px; }
        .video-card { display: inline-block; margin: 10px; background: #333; padding: 10px; border-radius: 8px; }
        video { width: 400px; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>My Private Netflix</h1>
        <div class="video-card">
            <h3>Now Playing: 500 Days of Summer</h3>
            <video controls>
                <source src="500 Days of Summer.mp4" type="video/mp4">
            </video>
        </div>
    </div>
</body>
</html>
