<!DOCTYPE html>
<html>
<head>
    <title>My OTT Platform</title>
    <style>
        body { background: #141414; color: white; font-family: Arial; padding: 20px; }
        h1 { color: #E50914; }
        .video-grid { display: flex; flex-wrap: wrap; gap: 20px; }
        .video-card { background: #1f1f1f; width: 300px; padding: 10px; border-radius: 8px; }
        video { width: 100%; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>My Private Netflix</h1>
    <div class="video-grid" id="movie-list">Loading movies...</div>

    <script>
        // This script asks the server for the list of movies
        fetch('/api/movies')
            .then(res => res.json())
            .then(movies => {
                const container = document.getElementById('movie-list');
                container.innerHTML = ''; // Clear the "Loading" text
                movies.forEach(movie => {
                    container.innerHTML += `
                        <div class="video-card">
                            <video controls><source src="${movie}" type="video/mp4"></video>
                            <p>${movie.replace('.mp4', '')}</p>
                        </div>`;
                });
            });
    </script>
</body>
</html>
